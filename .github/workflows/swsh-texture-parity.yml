name: SWSH texture pixel parity
on:
  push:
    branches: [research/swsh-image-resource-audit-20261126]
    paths:
      - scripts/swsh_texture*.py
      - tests/test_swsh_texture*.py
      - .github/workflows/swsh-texture-parity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/swsh_image_resource_audit.py
            /scripts/swsh_texture*.py
            /tests/test_swsh_texture*.py
            /Unpack/v1.3.2/catalog/image_source_inventory.csv
            /v1.3.2/1/bin/appli/**/*.bntx
            /v1.3.2/1/bin/appli/**/*.arc
            /v1.3.2/1/bin/graphics/**/*.bntx
            /v1.3.2/1/system_resource/texture/*.bntx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 Pillow==12.3.0 texture2ddecoder==1.0.6
      - run: python -m unittest discover -s tests -p test_swsh_texture_parity.py -v
      - run: python scripts/swsh_texture_parity_audit.py --verify-png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swsh-texture-parity-metadata
          path: |
            artifacts/swsh-texture-parity/*.json
            artifacts/swsh-texture-parity/*.jsonl
          if-no-files-found: warn
