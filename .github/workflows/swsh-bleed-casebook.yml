name: SWSH 1.3.2 weather bleed 268-case replay matrix

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/swsh_bleed_casebook.py
      - .github/workflows/swsh-bleed-casebook.yml

permissions:
  contents: write

concurrency:
  group: swsh-bleed-casebook-master
  cancel-in-progress: false

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/swsh_bleed_casebook.py
            /Unpack/v1.3.2/catalog/wild_weather_candidates.csv
            /Unpack/v1.3.2/catalog/wild_weather_locale_summary.json
            /Unpack/v1.3.2/catalog/nso_shiny_probe.json
            /Unpack/v1.3.2/catalog/weather_bleed_268_cases.csv
            /Unpack/v1.3.2/catalog/weather_bleed_scenarios.csv
            /Unpack/v1.3.2/catalog/weather_bleed_control_cases.csv
            /Unpack/v1.3.2/catalog/weather_bleed_runtime_observations_TEMPLATE.csv
            /Unpack/v1.3.2/catalog/weather_bleed_casebook_summary.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build original version-bound candidate cases and controls
        run: |
          set -euo pipefail
          python -m py_compile scripts/swsh_bleed_casebook.py
          python scripts/swsh_bleed_casebook.py --repo .
          python - <<'PY'
          from pathlib import Path
          import csv,json,collections
          base=Path('Unpack/v1.3.2/catalog')
          s=json.loads((base/'weather_bleed_casebook_summary.json').read_text('utf-8'))
          assert s['test_status']=='NOT_TESTED_ON_REAL_GAME_OR_EMULATOR'
          assert s['case_count']==268 and s['distinct_location_ids']==9
          assert s['scenario_count']>0 and s['control_count']>0
          assert sum(s['direction_counts'].values())==268
          for filename,n in s['outputs'].items():
              with (base/filename).open(encoding='utf-8-sig',newline='') as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)==n,(filename,len(rows),n)
              if filename=='weather_bleed_268_cases.csv':
                  assert all(x['runtime_status']=='NOT_TESTED' for x in rows)
                  assert len({x['case_id'] for x in rows})==268
          print('Casebook check:',s['case_count'],s['scenario_count'],s['control_count'])
          PY
      - name: Commit only source-backed analysis and empty evidence template
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Unpack/v1.3.2/catalog/weather_bleed_268_cases.csv Unpack/v1.3.2/catalog/weather_bleed_scenarios.csv Unpack/v1.3.2/catalog/weather_bleed_control_cases.csv Unpack/v1.3.2/catalog/weather_bleed_runtime_observations_TEMPLATE.csv Unpack/v1.3.2/catalog/weather_bleed_casebook_summary.json
          if git diff --cached --quiet; then
            echo 'No casebook changes'
            exit 0
          fi
          git commit -m 'data(swsh): 268-case version-bound weather bleed replay matrix [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin master
            if git push origin HEAD:master; then exit 0; fi
            sleep 3
          done
          exit 1
