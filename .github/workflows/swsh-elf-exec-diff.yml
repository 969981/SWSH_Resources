name: SWSH 1.3.2 executable segment byte comparison

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/swsh-elf-exec-diff.yml"

permissions:
  contents: write

concurrency:
  group: swsh-elf-exec-diff-master
  cancel-in-progress: false

jobs:
  compare-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sparse checkout verified Sword/Shield ELF inputs
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /v1.3.2/0/sword_main.elf
            /v1.3.2/0/shield_main.elf
            /tools/ghidra/swsh_elf_exec_diff.py
            /.github/workflows/swsh-elf-exec-diff.yml

      - name: Verify input provenance and produce machine-byte differences
        shell: bash
        run: |
          set -euo pipefail
          echo "4eaf6667a06d385db243b11f99207bbd3be293d58bfc6d55a355691333c81f43  v1.3.2/0/sword_main.elf" | sha256sum -c -
          echo "a6045f506af68254a434cc9c33658d5ec3171d18c55b0122b44fc645c347812a  v1.3.2/0/shield_main.elf" | sha256sum -c -
          python3 -m py_compile tools/ghidra/swsh_elf_exec_diff.py
          python3 tools/ghidra/swsh_elf_exec_diff.py \
            --sword v1.3.2/0/sword_main.elf \
            --shield v1.3.2/0/shield_main.elf \
            --out manifests/v1.3.2/swsh-elf-exec-diff.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          src=Path('manifests/v1.3.2/swsh-elf-exec-diff.json')
          d=json.loads(src.read_text())
          assert d['status']=='VERIFIED_EXECUTABLE_PROGRAM_SEGMENT_BYTES'
          a=d['aligned_executable_segments']
          assert len(a)>0, 'No aligned executable segments; refuse misleading comparison'
          total=sum(x['shared_bytes'] for x in a)
          delta=sum(x['shared_byte_differences'] for x in a)
          words=sum(x['shared_4byte_word_differences'] for x in a)
          md=Path('docs/research/swsh-elf-exec-diff-1.3.2.md')
          md.parent.mkdir(parents=True,exist_ok=True)
          md.write_text(
            '# Sword vs Shield 1.3.2 — executable ELF machine-byte comparison\n\n'
            'Source: existing two nx2elf-reconstructed ELF64/AArch64 programs; '
            'actual byte comparison generated by GitHub Actions with input SHA-256 checks.\n\n'
            f'- Sword ELF SHA-256: \`{d["sword"]["elf_sha256"]}\`\n'
            f'- Shield ELF SHA-256: \`{d["shield"]["elf_sha256"]}\`\n'
            f'- Same-VA executable PT_LOAD segments: **{len(a)}**\n'
            f'- Aligned executable bytes compared: **{total:,}**\n'
            f'- Differing aligned bytes: **{delta:,}**\n'
            f'- Differing 4-byte AArch64 words: **{words:,}**\n\n'
            'Full per-segment sizes, SHA-256 and the first 128 changed instruction-word '
            'virtual addresses are in [the source data](../../manifests/v1.3.2/swsh-elf-exec-diff.json).\n\n'
            '**Interpretation:** equal virtual address here means byte-aligned only; '
            'not proof of matching functions or behavior. '
            'Complete Ghidra function-body hashes are compared separately by '
            '\`tools/ghidra/swsh_compare.py\` after both analyses finish.\n', encoding='utf-8')
          print('Actual executable byte differences:',delta,'4-byte word differences:',words)
          PY
          cat docs/research/swsh-elf-exec-diff-1.3.2.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit byte comparison and source-backed research note
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f -- manifests/v1.3.2/swsh-elf-exec-diff.json docs/research/swsh-elf-exec-diff-1.3.2.md
          if ! git diff --cached --quiet; then
            git commit -m "data(swsh): persist exact Sword/Shield 1.3.2 executable machine-byte comparison"
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:refs/heads/master
          fi
          echo "Committed machine-byte comparison to master" >> "$GITHUB_STEP_SUMMARY"
