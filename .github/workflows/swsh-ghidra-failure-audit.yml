name: Audit SWSH Ghidra failed decompilations

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/swsh-ghidra-failure-audit.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: swsh-ghidra-failure-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == '969981/SWSH_Resources'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN: "42771375134"
      REPO: 969981/SWSH_Resources
      DEST: derived/v1.3.2/Ghidra_12.2_Run_42771375134/analysis
    steps:
      - name: Sparse checkout only workflow
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          persist-credentials: true
          sparse-checkout: |
            /.github/workflows/swsh-ghidra-failure-audit.yml

      - name: Verify actual analysis result and download C index artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.conclusion')" = success
          mkdir -p "$RUNNER_TEMP/audit_input"
          for game in sword shield; do
            dir="$RUNNER_TEMP/audit_input/$game"
            mkdir -p "$dir"
            gh run download "$RUN" -R "$REPO" --name "SWSH-$game-c" --dir "$dir"
            test -s "$dir/$game"_decompiled_index.csv
            test -s "$dir/$game"_decompiled_manifest.json
          done

      - name: Audit all failed C records and preserve exact Ghidra error text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEST"
          python3 - <<'PY'
          import csv,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"audit_input"
          out=Path(os.environ["DEST"])
          wanted={
            "sword":"4eaf6667a06d385db243b11f99207bbd3be293d58bfc6d55a355691333c81f43",
            "shield":"a6045f506af68254a434cc9c33658d5ec3171d18c55b0122b44fc645c347812a",
          }
          games={}
          failures=[]
          all_entries={}
          for game in ("sword","shield"):
            src=root/game
            manifest=json.loads((src/(game+"_decompiled_manifest.json")).read_text(encoding="utf-8"))
            assert manifest["original_elf_sha256_expected"]==wanted[game]
            assert manifest["decompiler_attempted"]==manifest["functions"]
            with (src/(game+"_decompiled_index.csv")).open(encoding="utf-8",newline="") as stream:
              rows=list(csv.DictReader(stream))
            assert len(rows)==manifest["functions"]
            ok=[v for v in rows if v["status"]=="OK" and v["zip_member"]]
            bad=[v for v in rows if v["status"]!="OK" or not v["zip_member"]]
            assert len(ok)==manifest["c_success"] and len(bad)==manifest["c_fail_or_empty"]
            all_entries[game]={v["entry"] for v in rows}
            for row in bad:
              failures.append({
                "game":game,
                "entry":row["entry"],
                "name":row["research_name"],
                "status":row["status"],
                "error":row["error"],
                "also_discovered_in_other_version":False,
              })
            games[game]={
              "identified_functions":len(rows),
              "c_success":len(ok),
              "failed_or_empty":len(bad),
              "failure_addresses":[v["entry"] for v in bad],
            }
          for row in failures:
            other="shield" if row["game"]=="sword" else "sword"
            row["also_discovered_in_other_version"]=row["entry"] in all_entries[other]
          info={
            "status":"VERIFIED_DECOMPILER_FAILURE_AUDIT",
            "source_run_id":int(os.environ["RUN"]),
            "source_url":"https://github.com/969981/SWSH_Resources/actions/runs/"+os.environ["RUN"],
            "games":games,
            "failures":failures,
            "interpretation":"Ghidra decompiler failure is not evidence of missing source bytes; addresses and error text come from actual per-function Ghidra export.",
          }
          (out/"decompiler_failures.json").write_text(json.dumps(info,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          with (out/"decompiler_failures.csv").open("w",encoding="utf-8",newline="") as fp:
            w=csv.DictWriter(fp,fieldnames=["game","entry","name","status","error","also_discovered_in_other_version"])
            w.writeheader()
            w.writerows(failures)
          lines=[
            "# Sword/Shield 1.3.2 — Ghidra decompiler failure audit",
            "",
            "Source: Ghidra 12.2 analysis Actions #42771375134, result success.",
            "",
            "| Game | Ghidra functions | C output OK | Failed/empty |",
            "| --- | ---: | ---: | ---: |",
          ]
          for game in ("sword","shield"):
            x=games[game]
            lines.append(f"| {game} | {x['identified_functions']:,} | {x['c_success']:,} | {x['failed_or_empty']:,} |")
          lines += ["","## Failed function entries",""]
          for x in failures:
            err=x["error"].replace("|","/").replace("\n"," ")[:160]
            lines.append(f"- **{x['game']}** {x['entry']} ({x['status']}): {err}")
          lines += [
            "",
            "Full Ghidra error strings are preserved in decompiler_failures.csv/json.",
            "These entries require manual inspection; no fabricated C is emitted.",
            "",
          ]
          (out/"README.md").write_text("\n".join(lines),encoding="utf-8")
          print(json.dumps({"games":games,"errors":failures},indent=2,ensure_ascii=False))
          PY
          cat "$DEST/README.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only small verified failure audit files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f -- "$DEST/README.md" "$DEST/decompiler_failures.csv" "$DEST/decompiler_failures.json"
          if git diff --cached --quiet; then
            echo "Failure audit already current"
            exit 0
          fi
          git commit -m "docs(swsh): audit ten failed Ghidra 12.2 C decompilations"
          git fetch -q origin master
          git rebase origin/master
          git push origin HEAD:refs/heads/master
          echo "Pushed original Ghidra failure audit to master" >> "$GITHUB_STEP_SUMMARY"
